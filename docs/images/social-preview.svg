<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="t d">
  <title id="t">deepseek-v4-flash-2x-dgx-spark</title>
  <desc id="d">Experimental: DeepSeek-V4-Flash on two DGX Spark nodes with a full 1M-token context, vLLM and Ray in Docker, tensor parallel over two QSFP cables. Community project, not affiliated with NVIDIA or DeepSeek.</desc>
  <!-- Source for the GitHub social preview. Export to PNG (1280x640) and upload in Settings > Social preview.
       Fixed dark theme on purpose: link cards don't follow the viewer's theme. No logos, hostnames or IPs. -->
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  </style>

  <rect x="0" y="0" width="1280" height="640" fill="#0d0d0d"/>
  <rect x="40" y="40" width="1200" height="560" rx="24" fill="#1a1a19"/>

  <!-- status chip -->
  <rect x="80" y="78" width="180" height="36" rx="18" fill="none" stroke="#3987e5" stroke-width="1.5"/>
  <text x="170" y="102" font-size="16" font-weight="600" letter-spacing="2" text-anchor="middle" fill="#c3c2b7">EXPERIMENTAL</text>

  <!-- title -->
  <text x="80" y="178" font-size="56" font-weight="700" fill="#ffffff">DeepSeek-V4-Flash on 2× DGX Spark</text>
  <text x="80" y="228" font-size="28" fill="#c3c2b7">Full 1M-token context · vLLM + Ray in Docker · tensor parallel</text>

  <!-- simplified topology -->
  <rect x="80" y="268" width="340" height="120" rx="16" fill="#2c2c2a"/>
  <text x="250" y="318" font-size="26" font-weight="600" text-anchor="middle" fill="#ffffff">Head node</text>
  <text x="250" y="352" font-size="18" text-anchor="middle" fill="#c3c2b7">vLLM API · Ray head · TP rank 0</text>

  <rect x="860" y="268" width="340" height="120" rx="16" fill="#2c2c2a"/>
  <text x="1030" y="318" font-size="26" font-weight="600" text-anchor="middle" fill="#ffffff">Worker node</text>
  <text x="1030" y="352" font-size="18" text-anchor="middle" fill="#c3c2b7">Ray worker · TP rank 1</text>

  <line x1="436" y1="328" x2="844" y2="328" stroke="#3987e5" stroke-width="8" stroke-linecap="round"/>
  <text x="640" y="306" font-size="20" font-weight="600" text-anchor="middle" fill="#ffffff">NCCL over RoCE</text>
  <text x="640" y="364" font-size="18" text-anchor="middle" fill="#c3c2b7">2 QSFP cables · 4 RoCE devices</text>

  <!-- key numbers -->
  <text x="80" y="470" font-size="40" font-weight="700" fill="#ffffff">1M tokens</text>
  <text x="80" y="502" font-size="18" fill="#c3c2b7">context, KV cache fixed at 11 GiB</text>

  <text x="480" y="470" font-size="40" font-weight="700" fill="#ffffff">905K</text>
  <text x="480" y="502" font-size="18" fill="#c3c2b7">token prompt served end to end</text>

  <text x="880" y="470" font-size="40" font-weight="700" fill="#ffffff">0 installs</text>
  <text x="880" y="502" font-size="18" fill="#c3c2b7">on the hosts, all in containers</text>

  <!-- footer -->
  <line x1="80" y1="536" x2="1200" y2="536" stroke="#2c2c2a" stroke-width="1"/>
  <text x="80" y="572" font-size="18" fill="#898781">github.com/dashaun/deepseek-v4-flash-2x-dgx-spark · Apache-2.0 · Community project, not affiliated with NVIDIA or DeepSeek</text>
</svg>
